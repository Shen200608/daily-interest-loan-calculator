name: Deploy to GitHub Pages

# 推送到 main 分支后自动发布静态网页到 GitHub Pages
# 仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验利率数据
        run: python tools/validate_rates.py data/rates.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 运行网页版公式测试
        run: node --test tests/test_finance.mjs

      - name: 运行桌面版公式测试
        run: python tests/test_finance.py

      - name: 准备发布目录
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icon.svg css js data _site/
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
