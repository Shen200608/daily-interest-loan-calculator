<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="利息计算器图标">
  <title>利息计算器</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c7cfa"/>
      <stop offset="55%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#2b3fa8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>

  <!-- 计算器外壳 -->
  <rect x="30" y="24" width="68" height="80" rx="12" fill="#ffffff" fill-opacity="0.96"/>
  <!-- 屏幕 -->
  <rect x="38" y="32" width="52" height="20" rx="5" fill="#e8edff"/>
  <text x="64" y="47.5" font-family="Consolas, 'SF Mono', monospace" font-size="13" font-weight="700"
        fill="#3b5bdb" text-anchor="middle">%</text>
  <!-- 按键 -->
  <g fill="#c8d3f5">
    <rect x="38" y="59" width="14" height="11" rx="3"/>
    <rect x="56" y="59" width="14" height="11" rx="3"/>
    <rect x="74" y="59" width="14" height="11" rx="3"/>
    <rect x="38" y="75" width="14" height="11" rx="3"/>
    <rect x="56" y="75" width="14" height="11" rx="3"/>
  </g>
  <!-- 高亮键（等号 / 结果） -->
  <rect x="74" y="75" width="14" height="23" rx="3" fill="#0d9488"/>

  <!-- 上升收益曲线 -->
  <path d="M20 96 L38 82 L54 88 L74 66 L96 52" fill="none" stroke="#34d399" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="96" cy="52" r="5.5" fill="#34d399"/>
</svg>
